<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script>
		try {
			if (sessionStorage.getItem('introPortadaVista') !== '27' && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
				document.documentElement.classList.add('intro-pending');
			}
		} catch {}
	</script>
	<title>Cuaderno de recetas</title>
	<link rel="icon" type="image/svg" sizes="32x32" href="./images/Logo_Recipes.svg">
	<link rel="preload" href="./fonts/BarlowCondensed-Bold-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="./css/fonts.css">
	<link rel="preload" href="./fonts/BarlowCondensed-Regular-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="./fonts/BarlowCondensed-Black-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="./fonts/PlayfairDisplay-Italic-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" type="text/css" href="./css/styles.css?v=intro-bar-20261112d">
	<style>
		/* Critical intro styles prevent an unstyled first frame while the rest of the page loads. */
		@font-face{
			font-family:"Barlow Condensed"; font-style:normal; font-weight:700; font-display:block;
			src:url("./fonts/BarlowCondensed-Bold-latin.woff2") format("woff2");
			unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
		}
		.IntroPortada-activa{overflow:hidden}
		.IntroPortada{--intro-fill-ease:cubic-bezier(.65,0,.35,1);display:none;position:fixed;inset:0;z-index:1000;overflow:hidden;background:transparent}
		html.intro-pending body>:not(.IntroPortada){visibility:hidden}
		html.intro-pending .IntroPortada,body.IntroPortada-activa>.IntroPortada{display:block}
		.IntroPortada_Fondo{position:absolute;inset:0;z-index:2;background:rgb(245,245,240);transform:translate3d(0,0,0);transition:transform 900ms cubic-bezier(.76,0,.18,1);will-change:transform}
		.IntroPortada_Escena{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:clamp(24px,3vw,34px)}
		.IntroPortada_Marca{position:relative;width:clamp(94px,calc(14vw - 10px),150px);aspect-ratio:814.95/496.1;display:grid;place-items:center}
		.IntroPortada_Logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
		.IntroPortada_Logo--base{opacity:.5}
		.IntroPortada_Logo--fill{clip-path:ellipse(150% 0% at 50% 100%);transition:clip-path 2050ms var(--intro-fill-ease)}
		.IntroPortada.is-filling .IntroPortada_Logo--fill{clip-path:ellipse(150% 150% at 50% 100%)}
		.IntroPortada_Indicador{display:grid;justify-items:center;gap:8px}
		.IntroPortada_Progreso{display:block;width:clamp(160px,21.5vw,258px);height:8px;min-height:8px;overflow:hidden;border:1px solid rgba(139,0,0,.9);border-radius:999px;background:rgba(139,0,0,.14)}
		.IntroPortada_Progreso span{display:block;width:100%;height:100%;border-radius:inherit;background:rgb(139,0,0);clip-path:inset(0 100% 0 0);transition:clip-path 2050ms var(--intro-fill-ease)}
		.IntroPortada.is-filling .IntroPortada_Progreso span{clip-path:inset(0 0 0 0)}
		.IntroPortada_Contador{color:rgb(139,0,0);font-family:"Barlow Condensed",sans-serif;font-size:clamp(18px,2.04vw,20px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
		.IntroPortada.is-revealing{pointer-events:none}
		.IntroPortada.is-revealing .IntroPortada_Fondo{transform:translate3d(0,-100%,0)}
		@media(max-width:600px){.IntroPortada_Escena{top:48%;gap:32px}.IntroPortada_Marca{width:clamp(100px,28vw,126px)}.IntroPortada_Progreso{width:min(50vw,188px)}}
		@media(max-height:520px){.IntroPortada_Escena{top:45%;gap:18px}.IntroPortada_Marca{width:min(21vh,132px)}.IntroPortada_Progreso{width:min(31vw,205px)}}
	</style>
	
</head>

<body>
	<div class="IntroPortada" aria-hidden="true">
		<div class="IntroPortada_Fondo">
			<div class="IntroPortada_Escena">
				<div class="IntroPortada_Marca">
					<img class="IntroPortada_Logo IntroPortada_Logo--base" src="./images/Logo_Recipes.svg" alt="">
					<img class="IntroPortada_Logo IntroPortada_Logo--fill" src="./images/Logo_Recipes.svg" alt="">
				</div>
				<div class="IntroPortada_Indicador" role="progressbar" aria-label="Carga de la página de inicio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
					<div class="IntroPortada_Progreso" style="display:block;width:clamp(160px,21.5vw,258px);height:8px;min-height:8px;overflow:hidden;border:1px solid rgba(139,0,0,.9);border-radius:999px;background:rgba(139,0,0,.14);flex:none"><span></span></div>
					<span class="IntroPortada_Contador" aria-hidden="true">0%</span>
				</div>
			</div>
		</div>
	</div>


<!-- CABECERA -->

		<header>
			<a href="./index.html" aria-label="Cuaderno de recetas, inicio" data-home-logo>
				<img src="./images/Logo_Recipes.svg" alt="Cuaderno de recetas">
			</a>
	</header>

<!-- TITULO -->
	<section class="SEC_Titulo SEC_Titulo--home">
		<div class="TXT_Buscador">
			<h1 class="Title">
				<span >Nuestro</span>CUADERNO<br>
				<span>de</span>RECETAS
			</h1>

<!-- BUSCADOR -->
			<div class="Buscador">
				<svg class="search-icon" xmlns="http://www.w3.org/2000/svg"
		         width="16" height="16" viewBox="0 0 24 24"
		         fill="none" stroke="currentColor"
		         stroke-width="1.5"
		         stroke-linecap="round"
		         stroke-linejoin="round">
		        <circle cx="11" cy="11" r="8"></circle>
		        <path d="m21 21-4.3-4.3"></path>
		   		</svg>
		   		<label class="visually-hidden" for="BuscadorInput">Buscar una receta</label>
		   		<input id="BuscadorInput" type="search" placeholder="Buscar una receta..." autocomplete="off" aria-controls="BuscadorResultados" aria-expanded="false">
		   		<button class="Buscador_Borrar" type="button" aria-label="Borrar búsqueda" hidden>×</button>
		   		<div class="BuscadorResultados" id="BuscadorResultados" aria-live="polite"></div>
			</div>

		</div>
	</section>

<!-- CATEGORIAS -->

	<nav id="Categorias" aria-label="Categorías de recetas"></nav>

<!-- FOOTER -->

	<footer>
		<div class="FooterBrand">
			<img class="FooterLogo" src="./video/Logo_Circle_GIF.gif?v=transparent-20261023" data-animated-src="./video/Logo_Circle_GIF.gif?v=transparent-20261023" data-static-src="./images/Logo_Recipes.svg" alt="Cuaderno de recetas" width="112" height="112" loading="lazy" decoding="async">
		</div>
		<div>© 2026 Recetario — Todos los derechos reservados.</div>
	</footer>


<!-- JS SCRIPT -->

	<script src="./data/recetas.js?v=recipe-images-20261110"></script>
	<script src="./js/app.js?v=intro-counter-20261112a"></script>

</body>
</html>
