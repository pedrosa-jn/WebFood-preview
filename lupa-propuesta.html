<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Propuesta de lupa · Cuaderno de recetas</title>
 <link rel="stylesheet" href="./css/fonts.css">
 <style>
  *{box-sizing:border-box}body{margin:0;background:#f5f5f0;color:#0a0c24;font-family:'Barlow Condensed',sans-serif}
  main{max-width:1000px;margin:auto;padding:36px 24px;display:grid;grid-template-columns:minmax(220px,1fr) 390px;gap:64px;align-items:center}
  h1{font-size:52px;line-height:1.02;color:#8b0000;margin:0 0 20px;font-weight:800;max-width:300px}
  p{font-size:22px;line-height:1.4;max-width:290px;margin:0 0 20px}
  a{color:#8b0000;text-underline-offset:4px}a:focus-visible{outline:2px solid #8b0000;outline-offset:4px}
  iframe{display:block;border:1px solid rgba(10,12,36,.24);width:390px;height:844px;background:#f5f5f0;visibility:hidden}
  iframe.is-ready{visibility:visible}.hint{font-size:18px}
  @media(max-width:740px){main{display:block;padding:24px 0 0}header{padding:0 22px}h1{font-size:38px;max-width:none}p{font-size:19px;max-width:none;margin-bottom:12px}iframe{width:100%;height:calc(100dvh - 190px);min-height:540px;border-inline:0}.hint{font-size:16px}}
 </style>
</head>
<body>
 <main>
  <header>
   <h1>BUSCAR, A LA VISTA.</h1>
   <p>Una lupa burdeos sobre crema, con su nombre y un pequeño agarre.</p>
   <p class="hint">Arrástrala y suéltala para probar el asentamiento. Al tocarla aparecen Buscar y Vista.</p>
   <p class="hint"><a href="./categoria.html?c=otros">Ver el botón actual</a></p>
  </header>
  <iframe title="Propuesta interactiva en la página real" src="./categoria.html?c=otros&amp;rev=settle-20261121"></iframe>
 </main>
 <script>
  const frame=document.querySelector('iframe');
  frame.addEventListener('load',()=>{
   const doc=frame.contentDocument;
   const style=doc.createElement('style');
   style.textContent=`
    @media(max-width:700px){
     .MobileTools{width:146px}
     .MobileTools .MobileTools_Toggle{width:146px;height:54px;background:#f5f5f0;color:#8b0000;border:1.5px solid #0a0c24;outline:none;box-shadow:0 3px 9px rgba(10,12,36,.15)}
     .MobileTools_Toggle>svg{left:15px;top:14px;width:24px;height:24px}
     .MobileTools_Toggle::after{content:'BUSCAR';position:absolute;left:49px;top:0;height:51px;display:flex;align-items:center;font:600 19px/1 'Barlow Condensed',sans-serif;letter-spacing:.045em;color:#0a0c24}
     .MobileTools_Toggle::before{content:'';position:absolute;right:13px;top:22px;width:8px;height:10px;background:radial-gradient(circle at 1.5px 1.5px,#8b0000 1.2px,transparent 1.4px) 0 0/5px 5px;opacity:.65}
     .MobileTools.is-expanded .MobileTools_Toggle::after{content:'CERRAR'}
     .MobileTools_Blob{display:none}
     .MobileTools_Options>button{left:0;right:auto;background:#0a0c24}
    }
   `;
   doc.head.append(style);
   frame.contentWindow.dispatchEvent(new Event('resize'));
   frame.contentWindow.scrollTo(0,Math.round(frame.contentWindow.innerHeight*.9));
   frame.classList.add('is-ready');
  });
 </script>
</body>
</html>
